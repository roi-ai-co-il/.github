<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Assistant:wght@300;400;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #C8A24A; } a:hover { color: #E0BC66; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0D0C; font-family: Assistant, 'Segoe UI', system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column;">

  <!-- Masthead -->
  <div style="padding: 22px 22px 0; display: flex; align-items: baseline; justify-content: space-between;">
    <span style="font-family: 'Frank Ruhl Libre', Georgia, serif; font-size: 19px; font-weight: 500; color: #F2EEE7; letter-spacing: -0.01em;">שי עובדיה</span>
    <span style="font-size: 11px; color: #6E6862; letter-spacing: 0.14em;">27.08.26</span>
  </div>
  <div style="height: 1px; background: #26231F; margin: 14px 22px 0;"></div>

  <!-- Hero number -->
  <div style="padding: 22px 22px 0; display: flex; flex-direction: column; gap: 7px;">
    <span style="font-size: 11px; color: #6E6862; letter-spacing: 0.18em;">שווי התיק</span>
    <span style="font-family: 'Frank Ruhl Libre', Georgia, serif; font-size: 44px; font-weight: 400; color: #F2EEE7; letter-spacing: -0.03em; line-height: 1; white-space: nowrap;">₪61.5<span style="font-size: 22px; color: #8C857D;">מ׳</span></span>
    <div style="display: flex; gap: 22px; margin-top: 9px;">
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 10px; color: #6E6862; letter-spacing: 0.1em;">חודשי</span>
        <span style="font-size: 16px; color: #F2EEE7; font-weight: 600; white-space: nowrap;">₪147,200</span>
      </div>
      <div style="width: 1px; background: #26231F;"></div>
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 10px; color: #6E6862; letter-spacing: 0.1em;">תשואה</span>
        <span style="font-size: 16px; color: #C8A24A; font-weight: 600;">2.9%</span>
      </div>
      <div style="width: 1px; background: #26231F;"></div>
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 10px; color: #6E6862; letter-spacing: 0.1em;">נכסים</span>
        <span style="font-size: 16px; color: #F2EEE7; font-weight: 600;">21</span>
      </div>
    </div>
  </div>

  <!-- Alert as a rule-led notice -->
  <div style="margin: 22px 22px 0; border-right: 2px solid #C0432A; padding: 2px 13px 2px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px;">
      <span style="font-family: 'Frank Ruhl Libre', Georgia, serif; font-size: 16px; color: #F2EEE7;">דירת גן ברמת השרון</span>
      <span style="font-size: 10px; color: #E0714F; letter-spacing: 0.06em; white-space: nowrap;">פג לפני 44 יום</span>
    </div>
    <span style="font-size: 12px; color: #6E6862;">אבי פרץ · ₪11,200 לחודש</span>
  </div>

  <!-- Section rule -->
  <div style="display: flex; align-items: center; gap: 10px; margin: 24px 22px 0;">
    <span style="font-size: 10px; color: #6E6862; letter-spacing: 0.2em; white-space: nowrap;">נכס נבחר</span>
    <div style="flex-grow: 1; height: 1px; background: #26231F;"></div>
  </div>

  <!-- Image-forward property -->
  <div style="margin: 14px 22px 0; position: relative; border-radius: 4px; overflow: hidden;">
    <img src="rothschild.jpg" alt="" style="width: 100%; height: 236px; object-fit: cover; display: block;">
    <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(14,13,12,0.94) 0%, rgba(14,13,12,0.25) 48%, rgba(14,13,12,0) 100%);"></div>
    <div style="position: absolute; right: 0; left: 0; bottom: 0; padding: 16px 16px 15px; display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 10px; color: #C8A24A; letter-spacing: 0.16em;">תל אביב</span>
      <span style="font-family: 'Frank Ruhl Libre', Georgia, serif; font-size: 22px; color: #F2EEE7; letter-spacing: -0.015em; line-height: 1.15;">דירת 4 חד׳ ברוטשילד</span>
      <span style="font-size: 12px; color: #A29A91;">שדרות רוטשילד 45</span>
    </div>
  </div>

  <!-- Figures under the plate -->
  <div style="margin: 15px 22px 0; display: flex; align-items: flex-end; justify-content: space-between; border-top: 1px solid #26231F; padding-top: 13px;">
    <div style="display: flex; flex-direction: column; gap: 3px;">
      <span style="font-size: 10px; color: #6E6862; letter-spacing: 0.1em;">שווי</span>
      <span style="font-family: 'Frank Ruhl Libre', Georgia, serif; font-size: 19px; color: #F2EEE7; white-space: nowrap;">₪4,500,000</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 3px; align-items: flex-end;">
      <span style="font-size: 10px; color: #6E6862; letter-spacing: 0.1em;">שכירות חודשית</span>
      <span style="font-family: 'Frank Ruhl Libre', Georgia, serif; font-size: 19px; color: #C8A24A; white-space: nowrap;">₪9,800</span>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <!-- Tab bar: letterforms, not icons -->
  <div style="display: flex; align-items: stretch; justify-content: space-around; border-top: 1px solid #26231F; padding: 0 14px 22px;">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-width: 56px; min-height: 44px; padding-top: 13px; border-top: 1px solid #C8A24A; margin-top: -1px;">
      <span style="font-size: 12px; color: #C8A24A; letter-spacing: 0.08em;">בית</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; min-width: 56px; min-height: 44px;">
      <span style="font-size: 12px; color: #6E6862; letter-spacing: 0.08em;">נכסים</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; min-width: 56px; min-height: 44px;">
      <span style="font-size: 12px; color: #6E6862; letter-spacing: 0.08em;">חוזים</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; min-width: 56px; min-height: 44px;">
      <span style="font-size: 12px; color: #6E6862; letter-spacing: 0.08em;">הוספה</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
