<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #5B54E8; } a:hover { color: #4640C9; }
  </style>
</helmet>

<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; font-family: Assistant, 'Segoe UI', system-ui, sans-serif; overflow: hidden; position: relative; background: #0B0A14;">

  <!-- Colour field behind the glass -->
  <div style="position: absolute; inset: 0;">
    <div style="position: absolute; width: 420px; height: 420px; border-radius: 50%; top: -130px; right: -110px; background: radial-gradient(circle, #5B54E8 0%, rgba(91,84,232,0) 68%); opacity: 0.85;"></div>
    <div style="position: absolute; width: 380px; height: 380px; border-radius: 50%; top: 190px; left: -140px; background: radial-gradient(circle, #C0439B 0%, rgba(192,67,155,0) 68%); opacity: 0.65;"></div>
    <div style="position: absolute; width: 400px; height: 400px; border-radius: 50%; bottom: -150px; right: -60px; background: radial-gradient(circle, #1E9EA8 0%, rgba(30,158,168,0) 70%); opacity: 0.55;"></div>
  </div>

  <div style="position: relative; height: 100%; display: flex; flex-direction: column;">

    <!-- Header -->
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 20px 0;">
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <span style="font-size: 12px; color: rgba(255,255,255,0.55);">ערב טוב</span>
        <span style="font-size: 23px; font-weight: 700; color: #FFFFFF; letter-spacing: -0.02em;">שי</span>
      </div>
      <div style="width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"><path d="M4 20V9l8-5 8 5v11h-5v-7h-6v7z"/></svg>
      </div>
    </div>

    <!-- Primary glass panel -->
    <div style="margin: 18px 20px 0; border-radius: 28px; padding: 20px; background: rgba(255,255,255,0.13); border: 1px solid rgba(255,255,255,0.22); backdrop-filter: blur(26px); -webkit-backdrop-filter: blur(26px); display: flex; flex-direction: column; gap: 15px;">
      <span style="font-size: 12px; color: rgba(255,255,255,0.62);">שווי התיק</span>
      <span style="font-size: 37px; font-weight: 700; color: #FFFFFF; letter-spacing: -0.035em; line-height: 1; white-space: nowrap;">₪61,550,000</span>
      <div style="display: flex; gap: 9px;">
        <div style="flex: 1; border-radius: 16px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.16); padding: 11px 13px; display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 10px; color: rgba(255,255,255,0.6);">חודשי</span>
          <span style="font-size: 16px; font-weight: 600; color: #FFFFFF; white-space: nowrap;">₪147,200</span>
        </div>
        <div style="flex: 1; border-radius: 16px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.16); padding: 11px 13px; display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 10px; color: rgba(255,255,255,0.6);">תשואה</span>
          <span style="font-size: 16px; font-weight: 600; color: #7DF3D0;">2.9%</span>
        </div>
        <div style="flex: 1; border-radius: 16px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.16); padding: 11px 13px; display: flex; flex-direction: column; gap: 3px;">
          <span style="font-size: 10px; color: rgba(255,255,255,0.6);">נכסים</span>
          <span style="font-size: 16px; font-weight: 600; color: #FFFFFF;">21</span>
        </div>
      </div>
    </div>

    <!-- Alert -->
    <div style="margin: 12px 20px 0; border-radius: 22px; padding: 14px 16px; background: rgba(255,120,96,0.2); border: 1px solid rgba(255,150,130,0.38); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); display: flex; align-items: center; gap: 12px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFC5B4" stroke-width="2" stroke-linecap="round" style="flex-shrink: 0;"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5v.01"/></svg>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 14px; font-weight: 600; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">דירת גן ברמת השרון</span>
        <span style="font-size: 12px; color: rgba(255,255,255,0.68);">אבי פרץ · פג לפני 44 יום</span>
      </div>
    </div>

    <!-- Property card -->
    <div style="margin: 12px 20px 0; border-radius: 26px; overflow: hidden; background: rgba(255,255,255,0.13); border: 1px solid rgba(255,255,255,0.22); backdrop-filter: blur(26px); -webkit-backdrop-filter: blur(26px);">
      <div style="position: relative; height: 138px;">
        <img src="rothschild.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block;">
        <span style="position: absolute; top: 11px; right: 11px; font-size: 11px; font-weight: 600; color: #0B0A14; background: #7DF3D0; border-radius: 999px; padding: 5px 11px;">מושכר</span>
      </div>
      <div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 16px; font-weight: 600; color: #FFFFFF; letter-spacing: -0.01em;">דירת 4 חד׳ ברוטשילד</span>
          <span style="font-size: 12px; color: rgba(255,255,255,0.6);">שדרות רוטשילד 45, תל אביב</span>
        </div>
        <div style="display: flex; align-items: flex-end; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.16); padding-top: 10px;">
          <span style="font-size: 15px; font-weight: 600; color: #FFFFFF; white-space: nowrap;">₪4,500,000</span>
          <span style="font-size: 15px; font-weight: 700; color: #7DF3D0; white-space: nowrap;">₪9,800<span style="font-size: 11px; font-weight: 400; color: rgba(255,255,255,0.55);"> / חודש</span></span>
        </div>
      </div>
    </div>

    <div style="flex-grow: 1;"></div>

    <!-- Floating glass tab bar -->
    <div style="margin: 0 20px 26px; border-radius: 26px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.24); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); display: flex; align-items: center; justify-content: space-around; padding: 8px 6px;">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 56px; min-height: 44px; background: rgba(255,255,255,0.2); border-radius: 18px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
        <span style="font-size: 10px; color: #FFFFFF; font-weight: 600;">בית</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 56px; min-height: 44px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linejoin="round"><path d="M4 20V9l8-5 8 5v11h-5v-7h-6v7z"/></svg>
        <span style="font-size: 10px; color: rgba(255,255,255,0.6);">נכסים</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 56px; min-height: 44px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linejoin="round"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></svg>
        <span style="font-size: 10px; color: rgba(255,255,255,0.6);">חוזים</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 56px; min-height: 44px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        <span style="font-size: 10px; color: rgba(255,255,255,0.6);">הוספה</span>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
